[mcp_servers.codegraph]
command = "node"
args = [
  "/home/reggie/vscode_folder/MCP/mcp-server-codegraph/dist/index.js",
  "/home/reggie/vscode_folder/jianji",
]
cwd = "/home/reggie/vscode_folder/MCP/mcp-server-codegraph"
startup_timeout_sec = 120
tool_timeout_sec = 120

[mcp_servers.codegraph.env]
CODEGRAPH_INDEX_PATH = ".codex/codegraph-index.json"

# aoci MCP server(由 aoci init 写入;项目级配置)
# 说明: Codex 仅对"受信任项目"加载项目级 .codex/config.toml,
#       首次在本仓运行 Codex 时请按其提示信任本项目。
[mcp_servers.aoci]
command = "/home/reggie/.local/bin/aoci"
args = ["--repo", "/home/reggie/vscode_folder/jianji", "mcp"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@1.10.1", "--autoConnect", "--userDataDir=/home/reggie/.config/chrome-profiles/cp-acfd83ab25d8", "--experimentalPageIdRouting", "--no-usage-statistics", "--no-performance-crux"]
startup_timeout_sec = 60
tool_timeout_sec = 120

